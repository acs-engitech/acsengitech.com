                        <tbody><template x-for="l in o.lines" :key="l.id"><tr><td><span class="mono small" x-text="l.item.sku"></span> <span class="small" x-text="l.item.name"></span></td><td class="r num" x-text="qty(l.qty - l.cancelled)"></td><td class="r num"><strong x-text="qty(l.freeToDispatch)"></strong></td><td class="r num" x-text="qty(l.dispatched)"></td><td class="r num" :style="l.outstanding > 0 && 'color:var(--wait)'" x-text="qty(Math.max(0, l.outstanding))"></td></tr></template></tbody></table></div>
                    </section>
                  </template>
                  <div class="empty panel" x-show="!readyOrders().length"><strong>Nothing to plan</strong>Orders appear here once their stock is reserved.</div>
                </div>
              </template>
              <template x-if="tab.dispatch === 'moving' || tab.dispatch === 'done'">
                <section class="panel">
                  <div class="table-wrap">
                    <table class="data">
                      <thead><tr><th>Shipment</th><th>Order / customer</th><th>Items</th><th>Status</th><th>Carrier · tracking</th><th>Dates</th><th></th></tr></thead>
                      <tbody><template x-for="s in shipmentsBy(tab.dispatch === 'done' ? 'delivered' : ['planned','packed','shipped','exception'])" :key="s.id"><tr>
                        <td class="mono" x-text="s.number"></td>
                        <td><span class="mono small" x-text="s.order.number"></span><div class="small" x-text="s.order.customer.label"></div></td>
                        <td class="small" x-text="s.lines.map((l) => `${qty(l.qty)} × ${l.item.sku}`).join(', ')"></td>
                        <td><span class="pill" :class="tone(s.status)" x-text="label(s.status)"></span><div class="small" style="color:var(--bad)" x-show="s.exceptionNote && s.status === 'exception'" x-text="s.exceptionNote"></div></td>
                        <td class="small" x-text="[s.carrier, s.trackingNo].filter(Boolean).join(' · ') || '—'"></td>
                        <td class="small muted" x-text="s.deliveredAt ? `delivered ${date(s.deliveredAt)}` : s.shippedAt ? `shipped ${date(s.shippedAt)}` : `planned ${date(s.plannedAt)}`"></td>
                        <td class="r"><div class="row" style="justify-content:flex-end">
                          <button class="btn sm" x-show="s.status === 'planned'" @click="act('shipment.pack', { id: s.id }, 'Packed.')">Packed</button>
                          <button class="btn sm primary" x-show="['planned','packed'].includes(s.status)" @click="ship(s)">Ship</button>
                          <button class="btn sm primary" x-show="s.status === 'shipped' || (s.status === 'exception' && s.exceptionFrom === 'shipped')" @click="deliver(s)">Delivered</button>
                          <button class="btn sm" x-show="s.status === 'exception'" @click="act('shipment.resolve', { id: s.id }, 'Exception resolved.')">Resolve</button>
                          <button class="btn sm ghost danger" x-show="['planned','packed','shipped'].includes(s.status)" @click="exception(s)">Exception</button>
                          <button class="btn sm ghost" x-show="['planned','packed'].includes(s.status)" @click="act('shipment.cancel', { id: s.id }, 'Shipment cancelled.')">Cancel</button>
                        </div></td>
                      </tr></template></tbody>
                    </table>
                    <div class="empty" x-show="!shipmentsBy(tab.dispatch === 'done' ? 'delivered' : ['planned','packed','shipped','exception']).length">Nothing here.</div>
                  </div>
                </section>
              </template>
              <template x-if="tab.dispatch === 'waiting'">
                <section class="panel">
                  <div class="panel-head"><h2>Confirmed orders still waiting for stock</h2><span class="sub">Purchasing receipts and reallocation approvals fill these automatically.</span></div>
                  <div class="table-wrap"><table class="data"><thead><tr><th>Order</th><th>Customer</th><th>Item</th><th class="r">Still needed</th></tr></thead>
                    <tbody><template x-for="row in (dispatch?.orders || []).filter((o) => !['cancelled','delivered'].includes(o.status)).flatMap((o) => o.lines.filter((l) => l.outstanding > 0).map((l) => ({ o, l })))" :key="row.l.id"><tr><td class="mono" x-text="row.o.number"></td><td x-text="row.o.customer.label"></td><td><span class="mono small" x-text="row.l.item.sku"></span></td><td class="r num" x-text="qty(row.l.outstanding)"></td></tr></template></tbody></table></div>
                </section>
              </template>
            </div>
          </div>
        </template>

        <!-- ===== Sales (reserved) ===== -->
        <template x-if="route.ws === 'sales'">
          <div>
            <header class="topbar"><button class="btn sm menu-toggle" @click="railOpen = true" aria-label="Open navigation">☰</button><div><h1>Sales</h1><div class="crumbs">Reserved</div></div></header>
            <div class="page"><section class="panel reserved"><h2>Not built yet — on purpose</h2><p class="muted">The sales module is reserved until ACS defines what it should own (for example: key-account planning, project/panel sales, targets). Customer enquiries, quotations and orders already run end to end in Trading.</p></section></div>
          </div>
        </template>

        <!-- ===== People ===== -->
        <template x-if="route.ws === 'people'">
          <div>
            <header class="topbar"><button class="btn sm menu-toggle" @click="railOpen = true" aria-label="Open navigation">☰</button><div><h1>People & access</h1><div class="crumbs">One role per person; the server checks every action against it</div></div><span class="spacer"></span><button class="btn primary" @click="editUser()">New person</button></header>
            <div class="page" x-show="people">
              <section class="panel">
                <div class="table-wrap">
                  <table class="data">
                    <thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Customer</th><th>Last sign-in</th><th>Status</th><th></th></tr></thead>
                    <tbody>
                      <tr><td>Director (site admin login)</td><td class="small" x-text="me.id === 0 ? me.email : 'configured in Vercel'"></td><td><span class="pill info">Director</span></td><td>—</td><td class="small muted">—</td><td><span class="pill ok">active</span></td><td class="small muted r">set via environment</td></tr>
                      <template x-for="u in people.users" :key="u.id"><tr :style="!u.active && 'opacity:.55'"><td x-text="u.name"></td><td class="small" x-text="u.email"></td><td><span class="pill" x-text="people.roles[u.role]?.label || u.role"></span></td><td class="small" x-text="u.customer || '—'"></td><td class="small muted" x-text="u.lastLoginAt ? ago(u.lastLoginAt) : 'never'"></td><td><span class="pill" :class="u.active ? 'ok' : ''" x-text="u.active ? 'active' : 'disabled'"></span></td><td class="r"><button class="btn sm ghost" @click="editUser(u)">Edit</button></td></tr></template>
                    </tbody>
                  </table>
                </div>
              </section>
              <section class="panel">
                <div class="panel-head"><h2>What each role can do</h2></div>
                <div class="panel-body small grid-3">
                  <div><strong>Director</strong><p class="muted">Everything. Approves quotations, purchase orders and production reallocations; plans production stock; manages people.</p></div>
                  <div><strong>Trading</strong><p class="muted">Enquiries, quotations, customer records and portal access; confirms orders; requests sourcing. Sees costs.</p></div>
                  <div><strong>Purchasing</strong><p class="muted">Suppliers, RFQs, offers, purchase orders, goods receipt and stock counts. Partner registrations in site admin.</p></div>
                  <div><strong>Dispatch</strong><p class="muted">Plans, ships and delivers reserved stock. Never sees supplier costs.</p></div>
                  <div><strong>HR / Content & SEO</strong><p class="muted">Website admin only: positions, applications and contact messages / page SEO, blogs, analytics, robots and llms.txt.</p></div>
                  <div><strong>Customer</strong><p class="muted">Own enquiries, sent quotations, orders and deliveries in the portal. Never sees costs or other customers.</p></div>
                </div>
              </section>
            </div>
          </div>
        </template>
      </div>

      <!-- ===== Lifecycle drawer ===== -->
      <template x-if="drawer">
        <div>
          <div class="scrim" @click="drawer = null"></div>
          <aside class="drawer" role="dialog" aria-modal="true" :aria-label="drawer.detail.enquiry.number" @keydown.escape.window="drawer = null">
            <div class="drawer-head">
              <div><div class="mono small muted" x-text="`${drawer.detail.enquiry.number} · ${drawer.detail.customer.label}`"></div><strong x-text="drawer.detail.enquiry.title"></strong></div>
              <span class="spacer" style="flex:1"></span>
              <a class="btn sm" :href="`/ops/trading/${drawer.id}`" @click.prevent="go(`/ops/trading/${drawer.id}`)" x-show="can('view.trading')">Open record</a>
              <button class="btn sm ghost" @click="drawer = null" aria-label="Close">✕</button>
            </div>
            <div class="drawer-body">
              <div class="stepper"><template x-for="s in lifecycle(drawer.detail)" :key="s.label"><div class="step" :class="s.state"><span x-text="s.label"></span><span class="ref" x-text="s.ref"></span></div></template></div>
              <div class="www" x-data="{ get g() { return guide(drawer.detail) } }" style="grid-template-columns:1fr"><div><div class="k">What</div><div class="v" x-text="g.what"></div></div><div><div class="k">Why</div><div class="v" x-text="g.why"></div></div><div><div class="k">How</div><div class="v" x-text="g.how"></div></div></div>
              <section class="panel">
                <div class="panel-head"><h3>Items</h3></div>
                <div class="table-wrap"><table class="data"><thead><tr><th>Item</th><th class="r">Qty</th><th class="r">Free</th><th>Allocation</th></tr></thead>
                  <tbody><template x-for="l in drawer.detail.lines" :key="l.id"><tr><td><span class="mono small" x-text="l.item.sku"></span></td><td class="r num" x-text="qty(l.qty)"></td><td class="r num" x-text="qty(l.stock.atp)"></td><td x-html="stockBar(l.stock)"></td></tr></template></tbody></table></div>
              </section>
              <template x-if="drawer.detail.order">
                <section class="panel">
                  <div class="panel-head"><h3 x-text="drawer.detail.order.number"></h3><span class="pill" :class="tone(drawer.detail.order.status)" x-text="label(drawer.detail.order.status)"></span><span class="sub num" x-text="inr(drawer.detail.order.totals.subtotal)"></span></div>
                  <div class="table-wrap"><table class="data"><thead><tr><th>Item</th><th class="r">Ordered</th><th class="r">Reserved</th><th class="r">Shipped</th><th class="r">Delivered</th></tr></thead>
                    <tbody><template x-for="l in drawer.detail.order.lines" :key="l.id"><tr><td class="mono small" x-text="l.item.sku"></td><td class="r num" x-text="qty(l.qty)"></td><td class="r num" x-text="qty(l.reserved)"></td><td class="r num" x-text="qty(l.dispatched)"></td><td class="r num" x-text="qty(l.delivered)"></td></tr></template></tbody></table></div>
                </section>
              </template>
              <section class="panel" x-show="drawer.detail.sourcing.length">
                <div class="panel-head"><h3>Purchasing</h3></div>
                <div class="panel-body stack small"><template x-for="s in drawer.detail.sourcing" :key="s.id"><div class="row"><span class="mono" x-text="s.number"></span><span class="pill" :class="tone(s.status)" x-text="label(s.status)"></span><span x-text="`${qty(s.qty)} × ${s.item.sku}`"></span><span class="muted" x-text="(s.offers.find((o) => o.selected) || {}).supplier || `${s.offers.length} offer(s)`"></span></div></template></div>
              </section>
              <section class="panel" x-show="drawer.detail.approvals.some((a) => a.status === 'pending')">
                <div class="panel-head"><h3>Waiting for approval</h3></div>
                <template x-for="a in drawer.detail.approvals.filter((a) => a.status === 'pending')" :key="a.id"><div class="alert medium"><span class="sev"></span><div x-text="a.summary"></div><div class="row"><button class="btn sm" @click="decide(a, 'reject')">Reject</button><button class="btn sm dark" @click="decide(a, 'approve')">Approve</button></div></div></template>
              </section>
              <section class="panel">
                <div class="panel-head"><h3>Full history</h3></div>
                <ul class="feed"><template x-for="e in drawer.detail.timeline" :key="e.id"><li><time x-text="time(e.at)"></time><div><span x-text="e.message || `${e.entityType} ${label(e.to)}`"></span><div class="who" x-text="e.actor"></div></div></li></template></ul>
              </section>
            </div>
          </aside>
        </div>
      </template>
    </div>
  </template>

  <!-- ============ Modals ============ -->
  <template x-if="modal">
    <div @keydown.escape.window="modal = null">
      <div class="scrim" style="z-index:51" @click="modal = null"></div>

      <template x-if="modal.kind === 'form'">
        <form class="modal" role="dialog" aria-modal="true" :aria-label="modal.title" @submit.prevent="submitForm()">
          <div class="modal-head"><h2 x-text="modal.title"></h2><p class="small muted" x-show="modal.intro" x-text="modal.intro" style="margin:6px 0 0"></p></div>
          <div class="modal-body">
            <template x-for="f in modal.fields" :key="f.name">
              <div>
                <template x-if="f.type === 'textarea'"><label class="lbl"><span x-text="f.label + (f.required ? ' *' : '')"></span><textarea class="field" x-model="modal.values[f.name]" :placeholder="f.placeholder || ''"></textarea></label></template>
                <template x-if="f.type === 'select'"><label class="lbl"><span x-text="f.label + (f.required ? ' *' : '')"></span><select class="field" x-model="modal.values[f.name]"><template x-for="o in f.options" :key="o[0]"><option :value="o[0]" :selected="String(o[0]) === String(modal.values[f.name])" x-text="o[1]"></option></template></select></label></template>
                <template x-if="f.type === 'checkbox'"><label class="row small"><input type="checkbox" x-model="modal.values[f.name]"><span x-text="f.label"></span></label></template>
                <template x-if="f.type === 'checks'"><fieldset class="stack" style="border:0;padding:0;margin:0;gap:6px"><legend class="lbl" style="margin-bottom:6px" x-text="f.label + (f.required ? ' *' : '')"></legend><template x-for="o in f.options" :key="o[0]"><label class="row small"><input type="checkbox" :checked="modal.values[f.name].includes(o[0])" @change="toggleCheck(f.name, o[0])"><span x-text="o[1]"></span></label></template><span class="hint" x-show="!f.options.length">None set up yet.</span></fieldset></template>
                <template x-if="!['textarea','select','checkbox','checks'].includes(f.type)"><label class="lbl"><span x-text="f.label + (f.required ? ' *' : '')"></span><input class="field" :type="f.type || 'text'" :step="f.type === 'number' ? 'any' : null" x-model="modal.values[f.name]" :placeholder="f.placeholder || ''"></label></template>
              </div>
            </template>
            <p class="err" x-show="modal.error" x-text="modal.error" role="alert"></p>
          </div>
          <div class="modal-foot"><button type="button" class="btn ghost" @click="modal = null">Cancel</button><button type="submit" class="btn" :class="modal.danger ? 'dark' : 'primary'" :disabled="modal.busy" x-text="modal.busy ? 'Working…' : modal.submit"></button></div>
        </form>
      </template>

      <template x-if="modal.kind === 'enquiry' || modal.kind === 'lines'">
        <form class="modal" role="dialog" aria-modal="true" @submit.prevent="modal.kind === 'enquiry' ? saveEnquiry() : saveLines()">
          <div class="modal-head"><h2 x-text="modal.kind === 'enquiry' ? 'New enquiry' : 'Requested items'"></h2></div>
          <div class="modal-body">
            <template x-if="modal.kind === 'enquiry'">
              <div class="stack">
                <label class="lbl">Customer *<select class="field" x-model.number="modal.data.customerId" required><option value="">Choose…</option><template x-for="c in catalog.customers" :key="c.id"><option :value="c.id" :selected="c.id === modal.data.customerId" x-text="c.label"></option></template></select></label>
                <span class="hint">Not listed? Close this and use “New customer”.</span>
                <label class="lbl">Subject *<input class="field" x-model="modal.data.title" required placeholder="e.g. PLC + HMI for MEE plant"></label>
                <div class="form-grid">
                  <label class="lbl">Received via<select class="field" x-model="modal.data.source"><option value="manual">Direct</option><option value="email">Email</option><option value="phone">Phone</option><option value="website">Website</option></select></label>
                  <label class="lbl">Reply due<input class="field" type="date" x-model="modal.data.dueAt"></label>
                </div>
                <label class="lbl">Notes<textarea class="field" x-model="modal.data.notes"></textarea></label>
              </div>
            </template>
            <div class="upper">Items</div>
            <template x-for="(l, i) in modal.data.lines" :key="i">
              <div class="row" style="flex-wrap:nowrap">
                <select class="field sm" x-model.number="l.itemId" aria-label="Item"><option value="">Choose item…</option><template x-for="it in catalog.items" :key="it.id"><option :value="it.id" :selected="it.id === l.itemId" x-text="`${it.sku} — ${it.name}`"></option></template></select>
                <input class="field sm num" type="number" min="0" step="any" x-model.number="l.qty" style="width:90px" aria-label="Quantity">
                <button type="button" class="btn sm ghost" @click="modal.data.lines.splice(i, 1)" aria-label="Remove">✕</button>
              </div>
            </template>
            <div class="row"><button type="button" class="btn sm" @click="modal.data.lines.push({ itemId: '', qty: 1 })">Add item</button><span class="hint" x-show="!catalog.items.length">The catalogue is empty — add items in Inventory first.</span></div>
          </div>
          <div class="modal-foot"><button type="button" class="btn ghost" @click="modal = null">Cancel</button><button class="btn primary" type="submit" :disabled="loading">Save</button></div>
        </form>
      </template>

      <template x-if="modal.kind === 'sourcing'">
        <form class="modal" role="dialog" aria-modal="true" @submit.prevent="saveSourcing()">
          <div class="modal-head"><h2>Request sourcing</h2><p class="small muted" style="margin:6px 0 0">Purchasing collects supplier offers; the selected landed cost and lead time come back to this enquiry.</p></div>
          <div class="modal-body">
            <div class="form-grid">
              <label class="lbl">Why<select class="field" x-model="modal.data.reason"><option value="shortfall">Not enough free stock</option><option value="pricing">Need supplier price only</option></select></label>
              <label class="lbl">Needed by<input class="field" type="date" x-model="modal.data.neededBy"></label>
            </div>
            <template x-for="l in modal.data.lines" :key="l.itemId"><label class="row" style="flex-wrap:nowrap"><input type="checkbox" x-model="l.pick"><span style="flex:1" class="small" x-text="l.label"></span><input class="field sm num" type="number" min="0" step="any" x-model.number="l.qty" style="width:90px" aria-label="Quantity"></label></template>
          </div>
          <div class="modal-foot"><button type="button" class="btn ghost" @click="modal = null">Cancel</button><button class="btn primary" type="submit" :disabled="loading || !modal.data.lines.some((l) => l.pick)">Send to Purchasing</button></div>
        </form>
      </template>

      <template x-if="modal.kind === 'shipment'">
        <form class="modal" role="dialog" aria-modal="true" @submit.prevent="saveShipment()">
          <div class="modal-head"><h2 x-text="`Plan shipment · ${modal.data.number}`"></h2><p class="small muted" style="margin:6px 0 0" x-text="modal.data.customer.label"></p></div>
          <div class="modal-body">
            <template x-for="l in modal.data.lines" :key="l.orderLineId"><div class="row" style="flex-wrap:nowrap"><span style="flex:1" class="small" x-text="l.label"></span><span class="small muted" x-text="`max ${qty(l.max)}`"></span><input class="field sm num" type="number" min="0" :max="l.max" step="any" x-model.number="l.qty" style="width:90px" aria-label="Quantity"></div></template>
            <div class="form-grid">
              <label class="lbl">Ship from<input class="field" x-model="modal.data.warehouse"></label>
              <label class="lbl">Carrier (if known)<input class="field" x-model="modal.data.carrier"></label>
              <label class="lbl">Planned date<input class="field" type="date" x-model="modal.data.plannedAt"></label>
            </div>
          </div>
          <div class="modal-foot"><button type="button" class="btn ghost" @click="modal = null">Cancel</button><button class="btn primary" type="submit" :disabled="loading">Plan shipment</button></div>
        </form>
      </template>

      <template x-if="modal.kind === 'secret'">
        <div class="modal" role="dialog" aria-modal="true">
          <div class="modal-head"><h2 x-text="modal.data.title"></h2><p class="small muted" style="margin:6px 0 0">Shown once. Copy it now and share it privately; only a hash is stored.</p></div>
          <div class="modal-body"><template x-for="row in modal.data.lines" :key="row[0]"><label class="lbl"><span x-text="row[0]"></span><div class="secret" x-text="row[1]"></div></label></template></div>
          <div class="modal-foot"><button class="btn primary" @click="modal = null">Done</button></div>
        </div>
      </template>
    </div>
  </template>
</body>
</html>
